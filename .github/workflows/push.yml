# Triggers intentionally disabled for Argus-OSS-Security.
# on: push
name: Push
jobs:
  draftRelease:
    name: Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Draft Release
        uses: toolmantim/release-drafter@v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
